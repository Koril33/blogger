<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        // 1. 配置为 class 模式
        tailwind.config = {
            darkMode: 'class'
        }

        // 2. 核心逻辑：初始加载时判断主题（放在 head 顶部防止闪烁）
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css" rel="stylesheet"/>
    <style>
        /* 1. 改善正文排版，增加行高，文字颜色更柔和 */
        .prose p {
            line-height: 1.8;
            margin-bottom: 2rem;
            color: #4b5563; /* zinc-600 */
        }
        .dark .prose p { color: #a1a1aa; /* zinc-400 */ }

        /* 2. 让二级标题（H2）带有艺术感的左侧装饰线 */
        .prose h2 {
            font-weight: 800;
            letter-spacing: -0.025em;
            margin-top: 3rem;
            margin-bottom: 1.5rem;
            position: relative;
        }
        .prose code::before,
        .prose code::after { content: "" !important; }

        /* 2. 只有行内代码需要背景，代码块(pre code)不需要 */
        :not(pre) > code {
            background-color: rgba(156, 163, 175, 0.2);
            padding: 0.2rem 0.4rem;
            border-radius: 0.25rem;
            font-size: 0.875em;
        }

        /* 3. 图片居中与圆角 */
        .prose img {
            border-radius: 0.75rem;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            transition: transform 0.5s ease;
        }
        .prose img:hover { transform: scale(1.02); }

        /* 4. 表格优化 */
        .prose table { width: 100%; border-collapse: collapse; }
        .prose th { background-color: rgba(156, 163, 175, 0.1); }

        .prose blockquote {
            border-left: 4px solid #3b82f6;
            background: linear-gradient(to right, rgba(59, 130, 246, 0.05), transparent);
            padding: 1.5rem;
            font-style: italic;
            border-radius: 0 0.5rem 0.5rem 0;
        }
    </style>
</head>
<body class="bg-white text-gray-900 dark:bg-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-300">
    <nav class="sticky top-0 z-50 bg-white/80 dark:bg-gray-800/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-700">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="/" class="text-xl font-bold bg-gradient-to-r from-blue-600 to-indigo-500 bg-clip-text text-transparent shrink-0">
                阿辉的博客
            </a>

            <div class="flex items-center gap-6">
                <div class="hidden md:flex items-center space-x-8 text-sm font-medium tracking-tight">
                    <a href="/index.html" class="relative group py-2">
                        <span class="text-zinc-500 group-hover:text-blue-500 transition">Blog</span>
                        <span class="absolute bottom-0 left-0 w-0 h-px bg-blue-500 transition-all group-hover:w-full"></span>
                    </a>
                    <a href="/archive.html" class="relative group py-2">
                        <span class="text-zinc-500 group-hover:text-blue-500 transition">Archive</span>
                        <span class="absolute bottom-0 left-0 w-0 h-px bg-blue-500 transition-all group-hover:w-full"></span>
                    </a>
                    <a href="/about/index.html" class="relative group py-2">
                        <span class="text-zinc-500 group-hover:text-blue-500 transition">About</span>
                        <span class="absolute bottom-0 left-0 w-0 h-px bg-blue-500 transition-all group-hover:w-full"></span>
                    </a>
                </div>

                <div class="hidden md:block w-px h-4 bg-gray-200 dark:bg-gray-700"></div>

                <button id="theme-toggle" class="group relative h-9 w-9 border border-zinc-200 dark:border-zinc-700 rounded-full flex items-center justify-center transition-all hover:bg-zinc-100 dark:hover:bg-zinc-800 active:scale-90">
                    <div id="theme-dot" class="w-3 h-3 rounded-full bg-zinc-800 dark:bg-zinc-100 transition-transform duration-500"></div>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-12">
        <article class="prose prose-slate dark:prose-invert lg:prose-xl max-w-none">
            </article>
    </main>

    <footer class="max-w-4xl mx-auto px-4 py-12 border-t border-gray-100 dark:border-gray-800 text-center">
        <p class="text-sm text-gray-400">
            © 2026 阿辉的博客 ·
            <a href="https://beian.miit.gov.cn/" target="_blank" class="hover:underline">浙ICP备19051268号</a>
        </p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script>
        hljs.highlightAll();

        // 主题切换脚本
        const themeToggle = document.getElementById('theme-toggle');
        const themeDot = document.getElementById('theme-dot');

        themeToggle.addEventListener('click', () => {
            // 切换 dark 类
            const isDark = document.documentElement.classList.toggle('dark');

            // 保存状态
            localStorage.theme = isDark ? 'dark' : 'light';

            // 按钮动效
            themeDot.style.transform = 'scale(1.5)';
            setTimeout(() => {
                themeDot.style.transform = 'scale(1)';
            }, 200);
        });
    </script>
</body>
</html>
