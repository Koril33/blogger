[project]
name = "djhx-blogger"
version = "0.3.1"
description = "A reliable Markdown blog builder with incremental images and safe SSH deployment."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Koril33"}]
keywords = ["blog", "markdown", "static-site", "cli"]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fabric>=3.2.3",
    "jinja2>=3.1.6",
    "markdown>=3.9",
    "pillow>=12.3.0",
    "platformdirs>=4.4.0",
    "typer>=0.27.2",
    "pyyaml>=6.0.3",
    "pygments>=2.21.0",
    # Security floors also apply when users install without this repository's uv.lock.
    "paramiko>=5.0.0",
    "cryptography>=50.0.2",
    "pynacl>=1.6.2",
    "soupsieve>=2.10",
    "tomli>=2.3.0; python_version < '3.11'",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.12",
    "twine>=6",
    "pip-audit>=2.9",
    "pyfakefs>=6.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[project.scripts]
blg = "djhx_blogger.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"djhx_blogger" = ["static/**/*"]
